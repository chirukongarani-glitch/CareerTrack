<!DOCTYPE html>
<html>

<head>

    <title>Delete Account - CareerTrack</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <div class="container">

        <h1>Delete Account</h1>

        <p>
            ⚠️ Are you sure you want to delete your CareerTrack account?
        </p>

        <p>
            This will permanently delete your account and all
            your saved career information.
        </p>

        <form method="POST"
              action="{{ url_for('delete_account') }}">

            <label>Email</label>

            <input type="email"
                   name="email"
                   placeholder="Enter your registered email"
                   required>


            <label>Password</label>

            <input type="password"
                   name="password"
                   placeholder="Enter your password"
                   required>


            <br><br>

            <button type="submit"
                    onclick="return confirm('Are you absolutely sure? Your account and all data will be permanently deleted.');">
                Delete My Account
            </button>

            <a href="/dashboard">
                Cancel
            </a>

        </form>

    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - CareerTrack</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(
                135deg,
                #eff6ff 0%,
                #f8fafc 50%,
                #eef2ff 100%
            );
            min-height: 100vh;
            color: #111827;
        }


        /* ==============================
           NAVIGATION
           ============================== */

        .auth-nav {
            width: 100%;
            min-height: 72px;

            padding: 0 7%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(255, 255, 255, 0.97);

            border-bottom: 1px solid #e5e7eb;

            box-shadow:
                0 2px 10px rgba(15, 23, 42, 0.05);
        }


        .auth-logo {
            display: flex;
            align-items: center;

            gap: 10px;

            text-decoration: none;

            color: #111827;

            font-size: 24px;
            font-weight: 800;
        }


        .logo-icon {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #2563eb;

            color: white;

            border-radius: 10px;

            font-size: 20px;
            font-weight: 800;

            box-shadow:
                0 5px 12px rgba(37, 99, 235, 0.22);
        }


        .auth-nav-links {
            display: flex;
            align-items: center;

            gap: 10px;
        }


        .auth-nav-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 10px 15px;

            border-radius: 8px;

            text-decoration: none;

            color: #4b5563;

            font-size: 14px;
            font-weight: 600;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }


        .auth-nav-links a:hover {
            color: #2563eb;
            background: #eff6ff;
        }


        .auth-nav-links .register-link {
            background: #2563eb;
            color: white;
        }


        .auth-nav-links .register-link:hover {
            background: #1d4ed8;
            color: white;
        }


        /* ==============================
           PAGE
           ============================== */

        .forgot-page {
            min-height: calc(100vh - 72px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 45px 20px;
        }


        /* ==============================
           CARD
           ============================== */

        .forgot-card {
            width: 100%;
            max-width: 470px;

            background: #ffffff;

            padding: 40px;

            border: 1px solid #e5e7eb;

            border-radius: 18px;

            box-shadow:
                0 20px 50px rgba(15, 23, 42, 0.10),
                0 4px 12px rgba(15, 23, 42, 0.04);
        }


        /* ==============================
           HEADER
           ============================== */

        .forgot-header {
            text-align: center;

            margin-bottom: 30px;
        }


        .forgot-icon {
            width: 58px;
            height: 58px;

            margin: 0 auto 17px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #eff6ff;

            color: #2563eb;

            border-radius: 50%;

            font-size: 25px;
        }


        .forgot-header h1 {
            margin: 0 0 9px;

            color: #111827;

            font-size: 29px;
            font-weight: 800;
        }


        .forgot-header p {
            margin: 0;

            color: #6b7280;

            font-size: 14px;

            line-height: 1.6;
        }


        /* ==============================
           FORM GROUP
           ============================== */

        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #374151;

            font-size: 14px;
            font-weight: 700;
        }


        .form-group input {
            width: 100%;
            height: 48px;

            padding: 0 14px;

            border: 1px solid #d1d5db;

            border-radius: 9px;

            background: #ffffff;

            color: #111827;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        .form-group input::placeholder {
            color: #9ca3af;
        }


        .form-group input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.10);
        }


        /* ==============================
           PASSWORD CONTAINER
           ============================== */

        .password-container {
            position: relative;

            width: 100%;
        }


        .password-container input {
            padding-right: 48px;
        }


        /* ==============================
           EYE BUTTON
           ============================== */

        .password-eye {
            position: absolute;

            right: 8px;
            top: 50%;

            transform: translateY(-50%);

            width: 36px;
            height: 36px;

            border: none;

            background: transparent;

            color: #6b7280;

            cursor: pointer;

            border-radius: 7px;

            padding: 0;

            font-size: 17px;

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }


        .password-eye:hover {
            background: #f3f4f6;

            color: #2563eb;
        }


        /* ==============================
           PASSWORD REQUIREMENTS
           ============================== */

        .password-requirements {
            display: flex;

            flex-direction: column;

            gap: 4px;

            margin-top: 9px;

            margin-bottom: 4px;
        }


        .password-requirements p {
            margin: 0;

            font-size: 12px;

            line-height: 16px;

            font-weight: 500;
        }


        .password-valid {
            color: #16a34a;
        }


        .password-invalid {
            color: #dc2626;
        }


        /* ==============================
           PASSWORD MATCH
           ============================== */

        .password-match {
            min-height: 18px;

            margin-top: 7px;
        }


        .password-match p {
            margin: 0;

            font-size: 12px;

            line-height: 16px;

            font-weight: 500;
        }


        /* ==============================
           RESET BUTTON
           ============================== */

        .reset-button {
            width: 100%;
            height: 48px;

            margin-top: 8px;

            border: none;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 6px 14px rgba(37, 99, 235, 0.20);

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .reset-button:hover {
            background: #1d4ed8;

            transform: translateY(-1px);

            box-shadow:
                0 8px 18px rgba(37, 99, 235, 0.25);
        }


        .reset-button:active {
            transform: translateY(0);
        }


        /* ==============================
           BOTTOM LINK
           ============================== */

        .forgot-bottom {
            margin: 22px 0 0;

            text-align: center;

            color: #6b7280;

            font-size: 14px;
        }


        .forgot-bottom a {
            color: #2563eb;

            text-decoration: none;

            font-weight: 700;
        }


        .forgot-bottom a:hover {
            text-decoration: underline;
        }


        /* ==============================
           MOBILE
           ============================== */

        @media (max-width: 600px) {

            .auth-nav {
                min-height: auto;

                padding: 14px 18px;

                gap: 12px;
            }


            .auth-logo {
                font-size: 20px;
            }


            .logo-icon {
                width: 34px;
                height: 34px;

                font-size: 18px;
            }


            .auth-nav-links {
                gap: 3px;
            }


            .auth-nav-links a {
                padding: 8px 9px;

                font-size: 12px;
            }


            .forgot-page {
                padding: 30px 15px;
            }


            .forgot-card {
                padding: 30px 24px;

                border-radius: 15px;
            }


            .forgot-header h1 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


<!-- ==============================
     NAVIGATION
     ============================== -->

<nav class="auth-nav">

    <a href="/" class="auth-logo">

        <span class="logo-icon">
            C
        </span>

        CareerTrack

    </a>


    <div class="auth-nav-links">

        <a href="/">
            Home
        </a>

        <a href="/login">
            Login
        </a>

        <a href="/register" class="register-link">
            Register
        </a>

    </div>

</nav>



<!-- ==============================
     FORGOT PASSWORD
     ============================== -->

<section class="forgot-page">

    <div class="forgot-card">


        <!-- HEADER -->

        <div class="forgot-header">

            <div class="forgot-icon">
                🔐
            </div>

            <h1>
                Forgot Password?
            </h1>

            <p>
                Enter your registered email and create a new
                password to regain access to your account.
            </p>

        </div>



        <!-- FORM -->

        <form method="POST">


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Registered Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required
                >

            </div>



            <!-- NEW PASSWORD -->

            <div class="form-group">

                <label for="new_password">
                    New Password
                </label>


                <div class="password-container">

                    <input
                        type="password"
                        id="new_password"
                        name="new_password"
                        placeholder="Enter new password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >


                    <button
                        type="button"
                        class="password-eye"
                        onclick="togglePassword('new_password', this)"
                        aria-label="Show password"
                    >
                        👁️
                    </button>

                </div>



                <!-- PASSWORD REQUIREMENTS -->

                <div class="password-requirements">

                    <p
                        id="length-rule"
                        class="password-invalid"
                    >
                        ✗ 8 characters minimum
                    </p>


                    <p
                        id="uppercase-rule"
                        class="password-invalid"
                    >
                        ✗ 1 uppercase letter
                    </p>


                    <p
                        id="lowercase-rule"
                        class="password-invalid"
                    >
                        ✗ 1 lowercase letter
                    </p>


                    <p
                        id="number-rule"
                        class="password-invalid"
                    >
                        ✗ 1 number
                    </p>


                    <p
                        id="special-rule"
                        class="password-invalid"
                    >
                        ✗ 1 special character
                    </p>

                </div>

            </div>



            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirm_password">
                    Confirm New Password
                </label>


                <div class="password-container">

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm new password"
                        autocomplete="new-password"
                        required
                    >


                    <button
                        type="button"
                        class="password-eye"
                        onclick="togglePassword('confirm_password', this)"
                        aria-label="Show password"
                    >
                        👁️
                    </button>

                </div>


                <!-- PASSWORD MATCH -->

                <div class="password-match">

                    <p id="match-rule"></p>

                </div>

            </div>



            <!-- RESET BUTTON -->

            <button
                type="submit"
                class="reset-button"
            >
                Reset Password
            </button>


        </form>



        <!-- LOGIN -->

        <p class="forgot-bottom">

            Remember your password?

            <a href="/login">
                Login
            </a>

        </p>


    </div>

</section>



<script>


/* ==============================
   SHOW / HIDE PASSWORD
   ============================== */

function togglePassword(inputId, button) {

    const input =
        document.getElementById(inputId);


    if (input.type === "password") {

        input.type = "text";

        button.textContent = "🙈";

        button.setAttribute(
            "aria-label",
            "Hide password"
        );

    }

    else {

        input.type = "password";

        button.textContent = "👁️";

        button.setAttribute(
            "aria-label",
            "Show password"
        );

    }

}



/* ==============================
   PASSWORD ELEMENTS
   ============================== */

const password =
    document.getElementById("new_password");


const confirmPassword =
    document.getElementById("confirm_password");



/* ==============================
   PASSWORD INPUT
   ============================== */

password.addEventListener("input", function () {

    const value =
        password.value;


    /* 8 CHARACTERS */

    updateRule(
        "length-rule",
        value.length >= 8
    );


    /* UPPERCASE */

    updateRule(
        "uppercase-rule",
        /[A-Z]/.test(value)
    );


    /* LOWERCASE */

    updateRule(
        "lowercase-rule",
        /[a-z]/.test(value)
    );


    /* NUMBER */

    updateRule(
        "number-rule",
        /[0-9]/.test(value)
    );


    /* SPECIAL CHARACTER */

    updateRule(
        "special-rule",
        /[^A-Za-z0-9]/.test(value)
    );


    checkPasswordMatch();

});



/* ==============================
   CONFIRM PASSWORD
   ============================== */

confirmPassword.addEventListener(
    "input",
    checkPasswordMatch
);



/* ==============================
   PASSWORD MATCH
   ============================== */

function checkPasswordMatch() {

    const passwordValue =
        password.value;


    const confirmValue =
        confirmPassword.value;


    const matchRule =
        document.getElementById("match-rule");


    if (confirmValue.length === 0) {

        matchRule.textContent = "";

        matchRule.className = "";

        return;

    }


    if (passwordValue === confirmValue) {

        matchRule.textContent =
            "✓ Passwords match";

        matchRule.className =
            "password-valid";

    }

    else {

        matchRule.textContent =
            "✗ Passwords do not match";

        matchRule.className =
            "password-invalid";

    }

}



/* ==============================
   UPDATE REQUIREMENT
   ============================== */

function updateRule(id, valid) {

    const rule =
        document.getElementById(id);


    const labels = {

        "length-rule":
            "8 characters minimum",

        "uppercase-rule":
            "1 uppercase letter",

        "lowercase-rule":
            "1 lowercase letter",

        "number-rule":
            "1 number",

        "special-rule":
            "1 special character"

    };


    if (valid) {

        rule.textContent =
            "✓ " + labels[id];

        rule.className =
            "password-valid";

    }

    else {

        rule.textContent =
            "✗ " + labels[id];

        rule.className =
            "password-invalid";

    }

}

</script>


</body>

</html>
